<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="5">
    <title>Canteen Counter Display</title>
    <style>
        body { font-family: sans-serif; background: #111; color: white; padding: 40px; text-align: center; }
        h1 { font-size: 40px; margin-bottom: 30px; }
        .grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; }
        .token-box { background: #222; border: 2px solid #28a745; padding: 20px; border-radius: 12px; min-width: 150px; }
        .number { font-size: 50px; font-weight: bold; color: #28a745; }
        .status { color: #aaa; margin-top: 5px; font-size: 14px; }
    </style>
</head>
<body>
    <h1>Canteen Live Queue</h1>
    <div class="grid">
        {% for item in queue_items %}
            <div class="token-box">
                <div class="number">#{{ item.token_number }}</div>
                <div class="status">{{ item.status }}</div>
            </div>
        {% else %}
            <h2>No active orders in queue</h2>
        {% endfor %}
    </div>
</body>
</html>
