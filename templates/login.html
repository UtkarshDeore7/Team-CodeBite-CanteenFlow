<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CanteenFlow - Auth</title>
    <style>
        body { font-family: sans-serif; background: #f4f6f9; margin: 0; padding: 40px; display: flex; justify-content: center; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 350px; }
        h2 { margin-top: 0; color: #333; }
        input { width: 100%; padding: 10px; margin: 8px 0 16px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #218838; }
        .flash { background: #ffe3e3; color: #dc3545; padding: 10px; border-radius: 4px; margin-bottom: 15px; font-size: 14px; }
        .toggle { margin-top: 15px; text-align: center; font-size: 14px; }
        .toggle a { color: #007bff; text-decoration: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="flash">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <div id="login-form">
            <h2>Sign In</h2>
            <form action="/login" method="POST">
                <label>Email</label>
                <input type="email" name="email" required>
                <label>Password</label>
                <input type="password" name="password" required>
                <button type="submit">Log In</button>
            </form>
            <div class="toggle">Need an account? <a onclick="showRegister()">Register</a></div>
        </div>

        <div id="register-form" style="display: none;">
            <h2>Register Student</h2>
            <form action="/register" method="POST">
                <label>Full Name</label>
                <input type="text" name="full_name" required>
                <label>Email</label>
                <input type="email" name="email" required>
                <label>Phone</label>
                <input type="text" name="phone">
                <label>Password</label>
                <input type="password" name="password" required>
                <button type="submit">Create Account</button>
            </form>
            <div class="toggle">Already registered? <a onclick="showLogin()">Sign In</a></div>
        </div>
    </div>

    <script>
        function showRegister() {
            document.getElementById('login-form').style.display = 'none';
            document.getElementById('register-form').style.display = 'block';
        }
        function showLogin() {
            document.getElementById('register-form').style.display = 'none';
            document.getElementById('login-form').style.display = 'block';
        }
    </script>
</body>
</html>
